<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Clinical Ambient Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800 M0 600 H800 M0 700 H800 M0 800 H800 M0 900 H800" />
    <path d="M100 0 V1000 M200 0 V1000 M300 0 V1000 M400 0 V1000 M500 0 V1000 M600 0 V1000 M700 0 V1000" />
  </g>

  <!-- Abstract Hospital Architecture & Glass Canopy -->
  <g opacity="0.18">
    <path d="M120 1000 L120 380 L380 240 L380 1000 Z" fill="#ffffff" />
    <path d="M380 240 L680 400 L680 1000 L380 1000 Z" fill="#2dd4bf" />
    <!-- Building Windows Grid -->
    <g fill="#ffffff" opacity="0.4">
      <rect x="160" y="420" width="30" height="40" rx="4" />
      <rect x="210" y="420" width="30" height="40" rx="4" />
      <rect x="260" y="420" width="30" height="40" rx="4" />
      <rect x="310" y="420" width="30" height="40" rx="4" />

      <rect x="160" y="490" width="30" height="40" rx="4" />
      <rect x="210" y="490" width="30" height="40" rx="4" />
      <rect x="260" y="490" width="30" height="40" rx="4" />
      <rect x="310" y="490" width="30" height="40" rx="4" />

      <rect x="160" y="560" width="30" height="40" rx="4" />
      <rect x="210" y="560" width="30" height="40" rx="4" />
      <rect x="260" y="560" width="30" height="40" rx="4" />
      <rect x="310" y="560" width="30" height="40" rx="4" />

      <rect x="420" y="450" width="40" height="35" rx="4" />
      <rect x="480" y="450" width="40" height="35" rx="4" />
      <rect x="540" y="450" width="40" height="35" rx="4" />
      <rect x="600" y="450" width="40" height="35" rx="4" />

      <rect x="420" y="520" width="40" height="35" rx="4" />
      <rect x="480" y="520" width="40" height="35" rx="4" />
      <rect x="540" y="520" width="40" height="35" rx="4" />
      <rect x="600" y="520" width="40" height="35" rx="4" />
    </g>
  </g>

  <!-- Glowing Heartbeat / ECG Waveform Across Center -->
  <path d="M0 650 L200 650 L230 650 L250 610 L270 700 L300 560 L330 730 L360 630 L380 660 L400 650 L800 650"
        stroke="url(#pulseGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M0 650 L200 650 L230 650 L250 610 L270 700 L300 560 L330 730 L360 630 L380 660 L400 650 L800 650"
        stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Centerpiece: Stylized Medical Stethoscope & Cross Emblem -->
  <g transform="translate(400, 320)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="140" fill="#042f2e" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="115" fill="url(#cardGrad)" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Medical Plus Symbol -->
    <path d="M-22 -55 H22 V-22 H55 V22 H22 V55 H-22 V22 H-55 V-22 H-22 Z" fill="url(#accentTeal)" />

    <!-- Stethoscope Loop Arc -->
    <path d="M-60 20 C-60 80 60 80 60 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M0 72 V105" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <circle cx="0" cy="115" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="200" r="160" fill="#14b8a6" opacity="0.15" filter="url(#glow)" />
  <circle cx="680" cy="750" r="180" fill="#0284c7" opacity="0.2" filter="url(#glow)" />

  <!-- Floating Clinical Data Card 1: Pulse & Vitals -->
  <g transform="translate(70, 480)">
    <rect width="260" height="90" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="45" r="18" fill="#14b8a6" fill-opacity="0.2" />
    <path d="M28 45 H33 L37 38 L41 52 L45 42 L47 45 H52" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="66" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Vital Monitoring</text>
    <text x="66" y="58" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">72 BPM · Stable</text>
    <text x="66" y="72" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">● 100% telemetry synced</text>
  </g>

  <!-- Floating Clinical Data Card 2: Multi-Facility Network -->
  <g transform="translate(470, 520)">
    <rect width="260" height="90" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="45" r="18" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M30 38 H42 V54 H30 Z M33 42 H39 M33 47 H39" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="66" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Network Status</text>
    <text x="66" y="58" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">5 Centers Online</text>
    <text x="66" y="72" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Active Queue: 99.8% On-Time</text>
  </g>

  <!-- Floating Clinical Data Card 3: Certified Staff -->
  <g transform="translate(250, 780)">
    <rect width="300" height="96" rx="20" fill="#042f2e" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="1.5" />
    <circle cx="42" cy="48" r="20" fill="#2dd4bf" fill-opacity="0.2" />
    <path d="M42 38 C38 38 35 41 35 45 C35 49 42 56 42 56 C42 56 49 49 49 45 C49 41 46 38 42 38 Z" fill="#2dd4bf" />
    <text x="74" y="40" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-transform="uppercase" letter-spacing="1">Unified Clinical Gate</text>
    <text x="74" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">5 Roles · 1 Secure Login</text>
    <text x="74" y="78" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Admin · Clinic · Doctor · Patient · Staff</text>
  </g>
</svg>
