<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient matching the royal blue in clinic11.jpg -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b66d6" />
      <stop offset="100%" stop-color="#2c53c0" />
    </linearGradient>

    <!-- Laptop Shadow & Gradients -->
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f5ff" />
      <stop offset="100%" stop-color="#e1ebfd" />
    </linearGradient>
    <linearGradient id="laptopBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e8f2" />
    </linearGradient>
    <linearGradient id="keyboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9e4fa" />
      <stop offset="100%" stop-color="#c5d6f5" />
    </linearGradient>

    <!-- Dropshadow filter for depth -->
    <filter id="isoDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#142c75" flood-opacity="0.38" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193380" flood-opacity="0.25" />
    </filter>

    <!-- X-Ray Cyan Glow Filter -->
    <filter id="xrayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Patient Avatar -->
    <clipPath id="avatarClip">
      <rect x="0" y="0" width="70" height="70" rx="12" />
    </clipPath>
  </defs>

  <!-- =========================================================================
       1. VIBRANT ROYAL BLUE BACKGROUND (as in clinic11.jpg)
       ========================================================================= -->
  <rect width="1200" height="900" fill="url(#bgGradient)" />

  <!-- Subtle Isometric Grid Accents -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <path d="M-100 200 L1300 900 M-100 400 L1300 1100 M-100 0 L1300 700" />
    <path d="M-100 700 L1300 0 M-100 900 L1300 200 M-100 1100 L1300 400" />
  </g>

  <!-- =========================================================================
       2. ISOMETRIC LAPTOP (Centerpiece)
       ========================================================================= -->
  <g id="isometricLaptop" filter="url(#isoDropShadow)">
    <!-- Base Bottom / Shadow Layer -->
    <polygon points="430,470 790,380 970,550 560,670" fill="#203f99" opacity="0.45" />

    <!-- Laptop Base Solid Geometry -->
    <!-- Base Bottom Lip -->
    <polygon points="420,460 780,370 960,540 550,660" fill="#cdd8ef" />
    <polygon points="550,660 960,540 960,556 550,676" fill="#abbfe3" />
    <polygon points="420,460 550,660 550,676 420,476" fill="#9db3de" />

    <!-- Keyboard Inset Surface -->
    <polygon points="450,470 760,390 920,530 570,630" fill="url(#keyboardGrad)" />

    <!-- Isometric Keyboard Keys Grid Rows -->
    <g fill="#4372e0" opacity="0.75">
      <!-- Row 1 -->
      <polygon points="475,475 735,405 745,413 483,483" />
      <!-- Row 2 -->
      <polygon points="490,490 750,420 760,428 498,498" />
      <!-- Row 3 -->
      <polygon points="505,505 765,435 775,443 513,513" />
      <!-- Row 4 -->
      <polygon points="520,520 780,450 790,458 528,528" />
      <!-- Spacebar row -->
      <polygon points="560,542 710,502 725,515 575,555" fill="#305dc7" />
    </g>

    <!-- Trackpad -->
    <polygon points="630,560 770,520 790,538 650,578" fill="#eaf1fc" stroke="#c2d5f7" stroke-width="1.5" />

    <!-- Laptop Screen Upright Section (Isometric Tilt) -->
    <!-- Screen Back & Outer Bezel -->
    <polygon points="530,105 845,260 845,555 530,400" fill="#ffffff" />
    <polygon points="515,100 530,105 530,400 515,395" fill="#dce5f7" />
    <polygon points="530,105 845,260 845,272 530,117" fill="#c3d5f5" />

    <!-- Inner Screen Display Area -->
    <polygon points="545,130 830,270 830,535 545,395" fill="url(#laptopScreenGrad)" />

    <!-- EHR PATIENT RECORD CARD (Floating on Laptop Screen) -->
    <g id="patientRecordCard" filter="url(#cardShadow)">
      <!-- Card White Canvas -->
      <polygon points="560,155 815,280 815,510 560,385" fill="#ffffff" rx="6" />

      <!-- Top Red Cross Medical Badge (+) -->
      <circle cx="585" cy="180" r="18" fill="#ef4444" />
      <rect x="581" y="169" width="8" height="22" rx="2" fill="#ffffff" />
      <rect x="574" y="176" width="22" height="8" rx="2" fill="#ffffff" />

      <!-- Patient Profile Avatar Frame -->
      <g transform="translate(615, 175) skewY(26)">
        <rect x="0" y="0" width="62" height="62" rx="12" fill="#3b82f6" />
        <!-- Stylized Patient Illustration -->
        <!-- Hair -->
        <path d="M16 18 C16 10, 46 10, 46 18 C46 22, 40 24, 31 24 C22 24, 16 22, 16 18 Z" fill="#92400e" />
        <!-- Head -->
        <circle cx="31" cy="24" r="11" fill="#fcd34d" />
        <!-- Shirt -->
        <path d="M12 55 C12 38, 50 38, 50 55 Z" fill="#1d4ed8" />
        <path d="M26 38 L31 46 L36 38 Z" fill="#fcd34d" />
      </g>

      <!-- Record Lines & Details (Isometric Horizontal Bars) -->
      <g fill="#94a3b8">
        <!-- Patient Name Line -->
        <polygon points="705,270 795,315 795,327 705,282" fill="#1e293b" />
        <!-- Subtitle ID -->
        <polygon points="705,290 775,325 775,333 705,298" fill="#64748b" />

        <!-- Divider -->
        <polygon points="580,295 795,400 795,403 580,298" fill="#e2e8f0" />

        <!-- Detail Line 1 -->
        <polygon points="580,315 790,418 790,426 580,323" fill="#64748b" />
        <!-- Detail Line 2 -->
        <polygon points="580,335 760,423 760,431 580,343" fill="#cbd5e1" />
        <!-- Detail Line 3 -->
        <polygon points="580,355 780,453 780,461 580,363" fill="#94a3b8" />
        <!-- Detail Line 4 -->
        <polygon points="580,375 740,453 740,461 580,383" fill="#cbd5e1" />
      </g>
    </g>
  </g>

  <!-- =========================================================================
       3. RIGHT DOCTOR (Pointing to Laptop Screen)
       ========================================================================= -->
  <g id="rightDoctor">
    <!-- Drop Shadow -->
    <ellipse cx="940" cy="740" rx="60" ry="24" fill="#142c75" opacity="0.4" />

    <!-- Legs & Shoes -->
    <!-- Left Leg -->
    <rect x="895" y="600" width="22" height="110" rx="8" fill="#60a5fa" />
    <path d="M875 715 C875 705, 920 705, 925 725 L885 730 Z" fill="#ffffff" />
    <!-- Right Leg -->
    <rect x="935" y="605" width="22" height="110" rx="8" fill="#60a5fa" />
    <path d="M935 725 C935 715, 975 715, 985 740 L945 745 Z" fill="#ffffff" />

    <!-- Torso / Dark Navy Under-Shirt -->
    <path d="M900 420 L965 425 L955 600 L905 600 Z" fill="#1e3a8a" />

    <!-- Doctor White Lab Coat Body -->
    <path d="M890 415 L975 420 L970 635 L885 630 Z" fill="#ffffff" />
    <path d="M885 415 L920 420 L915 630 L880 625 Z" fill="#f1f5f9" />
    <path d="M945 420 L975 420 L970 635 L940 632 Z" fill="#e2e8f0" />

    <!-- Right Extended Arm Pointing to Screen -->
    <path d="M900 440 L825 465 L815 480 L885 465 Z" fill="#ffffff" />
    <!-- Hand -->
    <circle cx="810" cy="475" r="11" fill="#fcd34d" />
    <!-- Pointer Stick extending towards laptop -->
    <line x1="810" y1="475" x2="735" y2="425" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left Arm Resting at side -->
    <path d="M965 435 L985 530 L965 535 L950 445 Z" fill="#ffffff" />
    <circle cx="975" cy="540" r="10" fill="#fcd34d" />

    <!-- Doctor Head & Face -->
    <!-- Neck -->
    <rect x="920" y="380" width="20" height="25" fill="#fcd34d" />
    <!-- Head Base -->
    <ellipse cx="930" cy="360" rx="24" ry="28" fill="#fcd34d" />
    <!-- Hair & Beard -->
    <path d="M910 345 C910 325, 955 325, 955 345 C958 355, 950 360, 950 370 C945 385, 920 385, 915 370 Z" fill="#92400e" />
    <ellipse cx="930" cy="358" rx="18" ry="19" fill="#fcd34d" />
    <!-- Eyes and smile -->
    <circle cx="922" cy="355" r="2.5" fill="#1e293b" />
    <circle cx="934" cy="356" r="2.5" fill="#1e293b" />
    <path d="M922 366 Q928 372 936 366" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- =========================================================================
       4. LEFT STANDING DOCTOR (With Stethoscope & Glasses)
       ========================================================================= -->
  <g id="leftStandingDoctor">
    <!-- Shadow -->
    <ellipse cx="320" cy="460" rx="50" ry="18" fill="#142c75" opacity="0.4" />

    <!-- Legs & Shoes -->
    <rect x="290" y="340" width="18" height="110" rx="6" fill="#1e3a8a" />
    <rect x="325" y="340" width="18" height="110" rx="6" fill="#1e3a8a" />
    <!-- Shoes -->
    <path d="M285 450 C285 440, 315 440, 320 460 L285 460 Z" fill="#1e293b" />
    <path d="M325 450 C325 440, 355 440, 360 460 L325 460 Z" fill="#1e293b" />

    <!-- Torso / Blue Shirt & Tie -->
    <rect x="285" y="165" width="60" height="180" fill="#2563eb" />
    <polygon points="312,175 318,175 322,230 315,245 308,230" fill="#1d4ed8" />

    <!-- White Lab Coat -->
    <path d="M270 160 L360 160 L355 350 L265 350 Z" fill="#ffffff" />
    <path d="M265 160 L295 160 L290 350 L260 350 Z" fill="#f8fafc" />
    <path d="M335 160 L365 160 L360 350 L330 350 Z" fill="#e2e8f0" />

    <!-- Stethoscope Around Neck -->
    <path d="M295 175 Q315 240 335 175" stroke="#94a3b8" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <circle cx="315" cy="235" r="7" fill="#64748b" />

    <!-- Left Arm Carrying Medical Folder -->
    <path d="M345 175 L365 240 L345 245 Z" fill="#ffffff" />
    <!-- Dark Folder -->
    <polygon points="340,210 375,190 385,250 350,270" fill="#1e293b" rx="4" />
    <polygon points="342,212 373,194 381,248 350,266" fill="#334155" />

    <!-- Right Arm -->
    <path d="M275 175 L260 250 L275 255 Z" fill="#ffffff" />
    <circle cx="265" cy="260" r="8" fill="#fed7aa" />

    <!-- Doctor Head, Glasses & Hair -->
    <rect x="305" y="130" width="16" height="25" fill="#fed7aa" />
    <ellipse cx="313" cy="115" rx="22" ry="24" fill="#fed7aa" />
    <!-- Black Hair -->
    <path d="M295 105 C295 80, 335 80, 335 105 C335 110, 330 115, 330 120 C325 105, 305 105, 295 105 Z" fill="#1e293b" />
    <!-- Modern Glasses -->
    <rect x="298" y="108" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
    <rect x="316" y="108" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
    <line x1="311" y1="112" x2="316" y2="112" stroke="#1e293b" stroke-width="2" />
    <!-- Smile -->
    <path d="M308 126 Q314 130 320 126" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- =========================================================================
       5. POTTED BLUE SUCCULENT PLANT (Between Doctor & Laptop)
       ========================================================================= -->
  <g id="pottedPlant">
    <!-- Shadow -->
    <ellipse cx="445" cy="385" rx="35" ry="14" fill="#142c75" opacity="0.3" />
    <!-- White Planter Pot -->
    <polygon points="415,290 475,290 460,375 430,375" fill="#ffffff" />
    <ellipse cx="445" cy="290" rx="30" ry="12" fill="#e2e8f0" />
    <!-- Soil -->
    <ellipse cx="445" cy="290" rx="26" ry="10" fill="#93c5fd" />
    <!-- Stylized Blue Succulent Leaves -->
    <path d="M445 285 Q420 220 445 190 Q470 220 445 285 Z" fill="#60a5fa" />
    <path d="M435 285 Q395 240 415 210 Q440 240 435 285 Z" fill="#38bdf8" />
    <path d="M455 285 Q495 240 475 210 Q450 240 455 285 Z" fill="#38bdf8" />
    <path d="M440 285 Q425 250 435 230 Q450 250 440 285 Z" fill="#93c5fd" />
  </g>

  <!-- =========================================================================
       6. FEMALE DOCTOR / NURSE (Holding Glowing X-Ray Tablet)
       ========================================================================= -->
  <g id="femaleDoctorWithXray">
    <!-- Shadow -->
    <ellipse cx="145" cy="740" rx="45" ry="18" fill="#142c75" opacity="0.4" />

    <!-- Legs & High Heels -->
    <rect x="130" y="620" width="12" height="100" fill="#fcd34d" />
    <rect x="150" y="620" width="12" height="100" fill="#fcd34d" />
    <!-- Heels -->
    <polygon points="125,715 145,715 140,735 125,735" fill="#1e3a8a" />
    <polygon points="145,715 165,715 160,735 145,735" fill="#1e3a8a" />

    <!-- Skirt -->
    <polygon points="120,590 170,590 175,635 115,635" fill="#1e3a8a" />

    <!-- White Lab Coat Body -->
    <path d="M110 420 L180 420 L185 625 L105 620 Z" fill="#ffffff" />
    <path d="M105 420 L135 420 L130 620 L100 615 Z" fill="#f1f5f9" />
    <path d="M155 420 L180 420 L185 625 L160 625 Z" fill="#e2e8f0" />

    <!-- Arms Holding Tablet -->
    <path d="M125 435 L145 480 L160 480 L170 435 Z" fill="#ffffff" />
    <circle cx="145" cy="485" r="7" fill="#fcd34d" />
    <circle cx="185" cy="485" r="7" fill="#fcd34d" />

    <!-- GLOWING CHEST X-RAY TABLET -->
    <g id="xrayTablet" filter="url(#xrayGlow)">
      <!-- Tablet Frame -->
      <polygon points="145,430 205,405 220,490 160,515" fill="#1e293b" rx="4" />
      <!-- Cyan Screen -->
      <polygon points="150,435 200,414 214,484 164,505" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <!-- Glowing Ribcage X-Ray Graphic -->
      <!-- Spine -->
      <line x1="182" y1="432" x2="190" y2="480" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Ribs -->
      <path d="M174 445 Q182 440 190 445" stroke="#22d3ee" stroke-width="2" fill="none" />
      <path d="M172 455 Q184 450 194 455" stroke="#22d3ee" stroke-width="2" fill="none" />
      <path d="M170 465 Q186 460 198 465" stroke="#22d3ee" stroke-width="2" fill="none" />
      <path d="M172 475 Q188 470 198 475" stroke="#22d3ee" stroke-width="1.8" fill="none" />
    </g>

    <!-- Head & Ponytail -->
    <rect x="135" y="380" width="14" height="20" fill="#fcd34d" />
    <ellipse cx="142" cy="365" rx="19" ry="22" fill="#fcd34d" />
    <!-- Brown Hair with Ponytail -->
    <path d="M125 365 C125 340, 160 340, 160 365 C160 375, 155 385, 135 385 Z" fill="#92400e" />
    <!-- Ponytail hanging behind -->
    <path d="M125 365 Q105 380 110 420 Q120 420 128 380 Z" fill="#78350f" />
    <!-- Facial profile -->
    <circle cx="152" cy="362" r="2.5" fill="#1e293b" />
    <path d="M148 372 Q153 376 158 372" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- =========================================================================
       7. SMARTPHONE WITH MEDICAL CROSS (Lying on desk)
       ========================================================================= -->
  <g id="smartphone" filter="url(#cardShadow)">
    <polygon points="195,590 350,510 415,570 260,650" fill="#1e293b" rx="8" />
    <!-- Screen Surface -->
    <polygon points="205,590 345,518 405,570 265,642" fill="#f8fafc" />
    <!-- Red Medical Cross on Screen -->
    <circle cx="305" cy="580" r="22" fill="#ef4444" />
    <rect x="300" y="568" width="10" height="24" rx="2" fill="#ffffff" />
    <rect x="293" y="575" width="24" height="10" rx="2" fill="#ffffff" />
  </g>

  <!-- =========================================================================
       8. MEDICAL CLIPBOARD WITH CHART & PEN (Foreground)
       ========================================================================= -->
  <g id="medicalClipboard" filter="url(#isoDropShadow)">
    <!-- Clipboard Frame -->
    <polygon points="220,770 500,620 625,740 345,890" fill="#1e3a8a" rx="12" />
    <polygon points="225,768 495,625 618,740 348,885" fill="#2563eb" />

    <!-- White Paper Chart Sheet -->
    <polygon points="245,765 480,638 595,745 360,872" fill="#ffffff" />

    <!-- Silver Metal Clip at Top -->
    <polygon points="415,640 475,605 505,635 445,670" fill="#94a3b8" />
    <ellipse cx="460" cy="638" rx="20" ry="10" fill="#cbd5e1" />

    <!-- Blue Heart Icon on Paper -->
    <g transform="translate(380, 680) scale(0.9)">
      <path d="M20 10 Q10 -5 0 10 Q-10 20 20 45 Q50 20 40 10 Q30 -5 20 10 Z" fill="#2563eb" />
    </g>

    <!-- Medical Pulse / Chart Lines on Paper -->
    <g fill="#93c5fd">
      <polygon points="300,740 450,660 450,667 300,747" />
      <polygon points="315,760 480,670 480,677 315,767" />
      <polygon points="330,780 460,710 460,717 330,787" fill="#60a5fa" />
      <polygon points="345,800 500,715 500,722 345,807" />
    </g>

    <!-- FOUNTAIN PEN Resting Across Clipboard -->
    <!-- Pen Shadow -->
    <polygon points="340,785 490,750 495,758 345,793" fill="#172554" opacity="0.4" />
    <!-- Pen Body -->
    <polygon points="330,775 480,740 484,752 334,787" fill="#1e293b" />
    <!-- Pen Silver Tip -->
    <polygon points="315,779 330,775 334,787" fill="#cbd5e1" />
    <!-- Pen Clip -->
    <polygon points="430,752 470,743 472,748 432,757" fill="#94a3b8" />
  </g>

  <!-- =========================================================================
       9. MEDICAL STETHOSCOPE (Foreground Bottom Right)
       ========================================================================= -->
  <g id="stethoscopeForeground" filter="url(#cardShadow)">
    <!-- Silver Chestpiece / Bell -->
    <ellipse cx="615" cy="740" rx="28" ry="16" fill="#cbd5e1" />
    <ellipse cx="615" cy="740" rx="20" ry="11" fill="#ffffff" />
    <ellipse cx="615" cy="740" rx="12" ry="7" fill="#64748b" />

    <!-- Rubber Tube Snaking -->
    <path d="M625 750 Q660 810 590 850 Q510 890 540 940 Q570 980 730 890 Q850 820 830 760" 
          stroke="#1e293b" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M625 750 Q660 810 590 850 Q510 890 540 940 Q570 980 730 890 Q850 820 830 760" 
          stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />

    <!-- Binaural Metal Tubes -->
    <path d="M830 760 Q790 730 740 780" stroke="#cbd5e1" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M830 760 Q860 720 900 760" stroke="#cbd5e1" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- Earpieces -->
    <circle cx="738" cy="780" r="7" fill="#1e293b" />
    <circle cx="902" cy="760" r="7" fill="#1e293b" />
  </g>

</svg>
