<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChedoCare - Clinical & Appointment Management Platform</title>
    <meta name="description" content="Multi-clinic and multi-doctor scheduling, medical records, and appointment management system with role-based access control." />
    <meta property="og:title" content="ChedoCare - Clinical & Appointment Management Platform" />
    <meta property="og:description" content="Multi-clinic and multi-doctor scheduling, medical records, and appointment management system with role-based access control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('chedocare_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
